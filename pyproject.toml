[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "caesar-cipher"
version = "0.1.0"
description = "A beginner-friendly Caesar cipher encoder/decoder (Udemy 100 Days of Code, Day 8)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [{ name = "Jens Tirsvad Nielsen" }]
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/008-caesar-cipher"
Documentation = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/008-caesar-cipher/wiki"
"Issue tracker" = "https://git.tirsystem.com/Tirsvad-Udemy-100-days-of-code/008-caesar-cipher/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
caesar-cipher = "caesar_cipher.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
